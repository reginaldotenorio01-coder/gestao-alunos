<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Daytrade" />
<title>Daytrade B3 — Livro de resultados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  html, body { background:#0B0E11; margin:0; padding:0; }
  * { -webkit-tap-highlight-color: transparent; }
  .font-sans { font-family: 'Inter', sans-serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  .no-scrollbar::-webkit-scrollbar { display:none; }
  .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
  @supports(padding:max(0px)) {
    .safe-bottom { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(0px, env(safe-area-inset-top)); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const ATIVOS = {
  WIN: { label: "WIN", cor: "#F2B705", nome: "Mini Índice" },
  WDO: { label: "WDO", cor: "#22D3EE", nome: "Mini Dólar" },
  BTC: { label: "BTC", cor: "#F7931A", nome: "Bitcoin Futuro" },
};

const STORAGE_KEY = "daytrade_trades_v1";
const CONTRATOS_OPCOES = Array.from({ length: 30 }, (_, i) => i + 1);
const ITEM_H = 40;

function fmtBRL(v) {
  const n = Number(v) || 0;
  const sign = n < 0 ? "-" : "";
  return sign + "R$ " + Math.abs(n).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDataCurta(iso) {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 10);
}

function IconPlus(props) {
  return <svg width={props.size||16} height={props.size||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
}
function IconTrash(props) {
  return <svg width={props.size||14} height={props.size||14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>;
}
function IconX(props) {
  return <svg width={props.size||16} height={props.size||16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
}
function IconUp(props) {
  return <svg width={props.size||13} height={props.size||13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
}
function IconDown(props) {
  return <svg width={props.size||13} height={props.size||13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>;
}

function SeletorContratos({ valor, onChange }) {
  const ref = useRef(null);
  const timeoutRef = useRef(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const idx = CONTRATOS_OPCOES.indexOf(valor);
    if (idx >= 0) el.scrollTop = idx * ITEM_H;
  }, []);

  function handleScroll() {
    const el = ref.current;
    if (!el) return;
    if (timeoutRef.current) clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(() => {
      const idx = Math.round(el.scrollTop / ITEM_H);
      const n = CONTRATOS_OPCOES[Math.min(Math.max(idx, 0), CONTRATOS_OPCOES.length - 1)];
      if (n && n !== valor) onChange(n);
    }, 80);
  }

  return (
    <div className="relative">
      <div className="pointer-events-none absolute left-0 right-0 top-1/2 -translate-y-1/2 border-y border-[#3A4552] bg-[#1F2630]/40 rounded-md z-10" style={{ height: ITEM_H }} />
      <div ref={ref} onScroll={handleScroll} className="h-[120px] overflow-y-scroll snap-y snap-mandatory no-scrollbar" style={{ scrollSnapType: "y mandatory" }}>
        <div style={{ height: ITEM_H }} />
        {CONTRATOS_OPCOES.map((n) => (
          <div key={n} className="flex items-center justify-center snap-center" style={{ height: ITEM_H, scrollSnapAlign: "center" }}>
            <span className={"font-mono tabular-nums transition-all " + (n === valor ? "text-[#E6EDF3] text-lg font-semibold" : "text-[#4A5568] text-sm")}>{n}</span>
          </div>
        ))}
        <div style={{ height: ITEM_H }} />
      </div>
    </div>
  );
}

function CurvaSVG({ dados }) {
  if (dados.length < 2) return null;
  const w = 320, h = 90, pad = 6;
  const valores = dados.map(d => d.acumulado);
  const min = Math.min(0, ...valores);
  const max = Math.max(0, ...valores);
  const range = max - min || 1;
  const stepX = (w - pad * 2) / (dados.length - 1);
  const pts = dados.map((d, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((d.acumulado - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const zeroY = h - pad - ((0 - min) / range) * (h - pad * 2);
  const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full" style={{ height: 90 }} preserveAspectRatio="none">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#00D68F" stopOpacity="0.35" />
          <stop offset="100%" stopColor="#00D68F" stopOpacity="0" />
        </linearGradient>
      </defs>
      <line x1={pad} y1={zeroY} x2={w-pad} y2={zeroY} stroke="#1F2630" strokeWidth="1" />
      <path d={area} fill="url(#grad)" />
      <path d={line} fill="none" stroke="#00D68F" strokeWidth="2" />
    </svg>
  );
}

function App() {
  const [trades, setTrades] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filtro, setFiltro] = useState("TODOS");
  const [mesFiltro, setMesFiltro] = useState("TODOS");
  const [formAberto, setFormAberto] = useState(false);

  const [form, setForm] = useState({
    data: todayISO(), ativo: "WIN", resultado: "", contratos: 1,
    temAdicao: false, contratosAdicao: 1, obs: "",
  });

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setTrades(JSON.parse(raw));
    } catch (e) {}
    setLoading(false);
  }, []);

  function persistir(novaLista) {
    setTrades(novaLista);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(novaLista)); } catch (e) {}
  }

  function adicionar(e) {
    e.preventDefault();
    const valor = parseFloat(String(form.resultado).replace(",", "."));
    if (isNaN(valor)) return;
    const novo = {
      id: uid(), data: form.data, ativo: form.ativo, resultado: valor,
      contratos: form.contratos || null,
      contratosAdicao: form.temAdicao ? form.contratosAdicao : null,
      obs: form.obs.trim(),
    };
    const lista = [novo, ...trades].sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : 0));
    persistir(lista);
    setForm({ ...form, resultado: "", contratos: 1, temAdicao: false, contratosAdicao: 1, obs: "" });
    setFormAberto(false);
  }

  function remover(id) { persistir(trades.filter((t) => t.id !== id)); }

  const filtrados = useMemo(() => {
    let lista = filtro === "TODOS" ? trades : trades.filter((t) => t.ativo === filtro);
    if (mesFiltro !== "TODOS") lista = lista.filter((t) => t.data.slice(0, 7) === mesFiltro);
    return lista;
  }, [trades, filtro, mesFiltro]);

  const meses = useMemo(() => {
    const porMes = {};
    trades.forEach((t) => {
      const chave = t.data.slice(0, 7);
      if (!porMes[chave]) porMes[chave] = { total: 0, qtd: 0 };
      porMes[chave].total += t.resultado;
      porMes[chave].qtd += 1;
    });
    const NOMES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    return Object.entries(porMes)
      .sort((a, b) => (a[0] < b[0] ? 1 : -1))
      .map(([chave, v]) => {
        const [ano, mes] = chave.split("-");
        return { chave, label: `${NOMES[parseInt(mes, 10) - 1]}/${ano.slice(2)}`, ...v };
      });
  }, [trades]);

  const stats = useMemo(() => {
    const base = filtrados;
    const total = base.reduce((s, t) => s + t.resultado, 0);
    const positivos = base.filter((t) => t.resultado > 0).length;
    const taxa = base.length ? (positivos / base.length) * 100 : 0;
    const melhor = base.length ? base.reduce((m, t) => (t.resultado > m ? t.resultado : m), -Infinity) : 0;
    const pior = base.length ? base.reduce((m, t) => (t.resultado < m ? t.resultado : m), Infinity) : 0;
    const porAtivo = Object.keys(ATIVOS).reduce((acc, k) => {
      acc[k] = trades.filter((t) => t.ativo === k).reduce((s, t) => s + t.resultado, 0);
      return acc;
    }, {});
    return { total, taxa, melhor, pior, porAtivo, qtd: base.length };
  }, [filtrados, trades]);

  const curva = useMemo(() => {
    const ordenado = [...filtrados].sort((a, b) => (a.data > b.data ? 1 : -1));
    let acc = 0;
    const porDia = {};
    ordenado.forEach((t) => { acc += t.resultado; porDia[t.data] = acc; });
    return Object.entries(porDia).map(([data, acumulado]) => ({ data, acumulado: Number(acumulado.toFixed(2)) }));
  }, [filtrados]);

  if (loading) {
    return <div className="min-h-screen bg-[#0B0E11] flex items-center justify-center text-[#6B7785]">carregando…</div>;
  }

  return (
    <div className="min-h-screen bg-[#0B0E11] text-[#E6EDF3] font-sans pb-28">
      <header className="border-b border-[#1F2630] sticky top-0 bg-[#0B0E11]/95 backdrop-blur z-20 safe-top">
        <div className="max-w-2xl mx-auto px-4 pt-5 pb-4">
          <div className="flex items-center justify-between mb-4">
            <div>
              <p className="text-[10px] uppercase tracking-[0.2em] text-[#6B7785] font-mono">Livro de resultados</p>
              <h1 className="text-xl font-semibold tracking-tight">Daytrade B3</h1>
            </div>
          </div>
          <div className="flex items-baseline gap-2">
            <span className={"font-mono text-3xl font-bold tabular-nums " + (stats.total >= 0 ? "text-[#00D68F]" : "text-[#FF4757]")}>{fmtBRL(stats.total)}</span>
            <span className="text-xs text-[#6B7785]">{stats.qtd} {stats.qtd === 1 ? "lançamento" : "lançamentos"}</span>
          </div>
          <div className="flex gap-2 mt-4 overflow-x-auto no-scrollbar">
            {["TODOS", ...Object.keys(ATIVOS)].map((k) => {
              const ativo = k !== "TODOS" ? ATIVOS[k] : null;
              const valor = k !== "TODOS" ? stats.porAtivo[k] : null;
              const ativoFiltro = filtro === k;
              return (
                <button key={k} onClick={() => setFiltro(k)}
                  className={"shrink-0 px-3 py-1.5 rounded-full border font-mono text-xs flex items-center gap-1.5 transition-colors " + (ativoFiltro ? "border-[#E6EDF3] bg-[#1F2630]" : "border-[#1F2630] text-[#6B7785]")}>
                  {ativo && <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: ativo.cor }} />}
                  {k}
                  {valor !== null && (
                    <span className={valor >= 0 ? "text-[#00D68F]" : "text-[#FF4757]"}>
                      {valor >= 0 ? "+" : ""}{valor.toLocaleString("pt-BR", { maximumFractionDigits: 0 })}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
          {meses.length > 0 && (
            <div className="flex gap-2 mt-2 overflow-x-auto no-scrollbar">
              {[{ chave: "TODOS", label: "Tudo", total: null }, ...meses].map((m) => {
                const ativoMes = mesFiltro === m.chave;
                return (
                  <button key={m.chave} onClick={() => setMesFiltro(m.chave)}
                    className={"shrink-0 px-3 py-1.5 rounded-full border font-mono text-xs flex items-center gap-1.5 transition-colors " + (ativoMes ? "border-[#E6EDF3] bg-[#1F2630]" : "border-[#1F2630] text-[#6B7785]")}>
                    {m.label}
                    {m.total !== null && (
                      <span className={m.total >= 0 ? "text-[#00D68F]" : "text-[#FF4757]"}>
                        {m.total >= 0 ? "+" : ""}{m.total.toLocaleString("pt-BR", { maximumFractionDigits: 0 })}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </header>

      <main className="max-w-2xl mx-auto px-4">
        <div className="grid grid-cols-3 gap-2 mt-5">
          <div className="bg-[#12161C] border border-[#1F2630] rounded-xl px-3 py-3">
            <p className="text-[10px] text-[#6B7785] uppercase tracking-wide mb-1">Acerto</p>
            <p className="font-mono text-sm font-semibold">{stats.taxa.toFixed(0)}%</p>
          </div>
          <div className="bg-[#12161C] border border-[#1F2630] rounded-xl px-3 py-3">
            <p className="text-[10px] text-[#6B7785] uppercase tracking-wide mb-1">Melhor</p>
            <p className="font-mono text-sm font-semibold text-[#00D68F]">{stats.melhor > 0 ? "+" : ""}{stats.melhor.toLocaleString("pt-BR", { maximumFractionDigits: 0 })}</p>
          </div>
          <div className="bg-[#12161C] border border-[#1F2630] rounded-xl px-3 py-3">
            <p className="text-[10px] text-[#6B7785] uppercase tracking-wide mb-1">Pior</p>
            <p className="font-mono text-sm font-semibold text-[#FF4757]">{stats.pior.toLocaleString("pt-BR", { maximumFractionDigits: 0 })}</p>
          </div>
        </div>

        {curva.length > 1 && (
          <div className="mt-4 bg-[#12161C] border border-[#1F2630] rounded-xl px-3 pt-3 pb-2">
            <p className="text-[10px] text-[#6B7785] uppercase tracking-wide mb-1">Curva acumulada</p>
            <CurvaSVG dados={curva} />
          </div>
        )}

        <div className="mt-5 space-y-2">
          {filtrados.length === 0 && (
            <div className="text-center py-14 text-[#6B7785]">
              <p className="text-sm">Nenhum lançamento ainda.</p>
              <p className="text-xs mt-1">Toca em + para lançar seu primeiro resultado.</p>
            </div>
          )}
          {filtrados.map((t) => (
            <div key={t.id} className="bg-[#12161C] border border-[#1F2630] rounded-xl px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3 min-w-0">
                <span className="w-8 h-8 rounded-lg flex items-center justify-center text-[10px] font-mono font-bold shrink-0"
                  style={{ backgroundColor: ATIVOS[t.ativo].cor + "1A", color: ATIVOS[t.ativo].cor }}>{t.ativo}</span>
                <div className="min-w-0">
                  <p className="text-sm font-medium font-mono">{fmtDataCurta(t.data)}</p>
                  <p className="text-xs text-[#6B7785] truncate">
                    {t.contratos ? `${t.contratos}${t.contratosAdicao ? ` + ${t.contratosAdicao}` : ""} contr. · ` : ""}
                    {t.obs || ATIVOS[t.ativo].nome}
                  </p>
                </div>
              </div>
              <div className="flex items-center gap-3 shrink-0">
                <span className={"font-mono text-sm font-semibold tabular-nums flex items-center gap-1 " + (t.resultado >= 0 ? "text-[#00D68F]" : "text-[#FF4757]")}>
                  {t.resultado >= 0 ? <IconUp /> : <IconDown />}
                  {fmtBRL(t.resultado)}
                </span>
                <button onClick={() => remover(t.id)} className="text-[#6B7785] hover:text-[#FF4757] transition-colors" aria-label="Remover lançamento">
                  <IconTrash />
                </button>
              </div>
            </div>
          ))}
        </div>
      </main>

      <button onClick={() => setFormAberto(true)}
        className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-[#E6EDF3] text-[#0B0E11] flex items-center justify-center shadow-lg shadow-black/40 active:scale-95 transition-transform z-30">
        <IconPlus size={24} />
      </button>

      {formAberto && (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 flex items-end sm:items-center justify-center">
          <form onSubmit={adicionar} className="bg-[#12161C] border border-[#1F2630] w-full sm:max-w-sm sm:rounded-2xl rounded-t-2xl px-5 pt-5 pb-6 space-y-4 safe-bottom max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between">
              <h2 className="text-sm font-semibold">Novo lançamento</h2>
              <button type="button" onClick={() => setFormAberto(false)} className="text-[#6B7785] hover:text-[#E6EDF3]"><IconX size={18} /></button>
            </div>

            <div className="grid grid-cols-3 gap-2">
              {Object.keys(ATIVOS).map((k) => (
                <button type="button" key={k} onClick={() => setForm((f) => ({ ...f, ativo: k }))}
                  className={"py-2 rounded-lg text-xs font-mono font-semibold border transition-colors " + (form.ativo === k ? "" : "border-[#1F2630] text-[#6B7785]")}
                  style={form.ativo === k ? { backgroundColor: ATIVOS[k].cor + "1A", color: ATIVOS[k].cor, borderColor: ATIVOS[k].cor, borderWidth: 1, borderStyle: "solid" } : {}}>
                  {k}
                </button>
              ))}
            </div>

            <div>
              <label className="text-[10px] uppercase tracking-wide text-[#6B7785]">Data</label>
              <input type="date" value={form.data} onChange={(e) => setForm((f) => ({ ...f, data: e.target.value }))}
                className="mt-1 w-full bg-[#0B0E11] border border-[#1F2630] rounded-lg px-3 py-2 text-sm font-mono outline-none focus:border-[#3A4552]" required />
            </div>

            <div>
              <label className="text-[10px] uppercase tracking-wide text-[#6B7785]">Resultado (R$) — negativo para prejuízo</label>
              <input type="text" inputMode="decimal" placeholder="Ex: 350 ou -120,50" value={form.resultado}
                onChange={(e) => setForm((f) => ({ ...f, resultado: e.target.value }))}
                className="mt-1 w-full bg-[#0B0E11] border border-[#1F2630] rounded-lg px-3 py-2 text-sm font-mono outline-none focus:border-[#3A4552]" required />
            </div>

            <div>
              <label className="text-[10px] uppercase tracking-wide text-[#6B7785]">Contratos (entrada)</label>
              <div className="mt-1"><SeletorContratos valor={form.contratos} onChange={(n) => setForm((f) => ({ ...f, contratos: n }))} /></div>

              {!form.temAdicao ? (
                <button type="button" onClick={() => setForm((f) => ({ ...f, temAdicao: true }))}
                  className="mt-2 text-xs text-[#6B7785] hover:text-[#E6EDF3] flex items-center gap-1 transition-colors">
                  <IconPlus size={12} /> Fiz adição nessa operação
                </button>
              ) : (
                <div className="mt-3 border-t border-[#1F2630] pt-3">
                  <div className="flex items-center justify-between mb-1">
                    <label className="text-[10px] uppercase tracking-wide text-[#6B7785]">Contratos adicionados</label>
                    <button type="button" onClick={() => setForm((f) => ({ ...f, temAdicao: false }))} className="text-[#6B7785] hover:text-[#FF4757]"><IconX size={13} /></button>
                  </div>
                  <SeletorContratos valor={form.contratosAdicao} onChange={(n) => setForm((f) => ({ ...f, contratosAdicao: n }))} />
                  <p className="text-[11px] text-[#6B7785] mt-1 font-mono">Total na operação: {form.contratos + form.contratosAdicao} contr.</p>
                </div>
              )}
            </div>

            <div>
              <label className="text-[10px] uppercase tracking-wide text-[#6B7785]">Observação (opcional)</label>
              <input type="text" placeholder="Ex: rompimento de máxima" value={form.obs}
                onChange={(e) => setForm((f) => ({ ...f, obs: e.target.value }))}
                className="mt-1 w-full bg-[#0B0E11] border border-[#1F2630] rounded-lg px-3 py-2 text-sm outline-none focus:border-[#3A4552]" />
            </div>

            <button type="submit" className="w-full bg-[#E6EDF3] text-[#0B0E11] rounded-lg py-2.5 text-sm font-semibold hover:opacity-90 transition-opacity">
              Lançar resultado
            </button>
          </form>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Gestão de Alunos</title>

<!-- iOS "Add to Home Screen" behavior: opens full-screen, no browser chrome -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Alunos" />
<meta name="theme-color" content="#1B1F22" />

<!-- React + Babel (so this stays a single portable file, no build step) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1B1F22; overscroll-behavior-y: none; }
  #root { min-height: 100vh; }
  .pt-display { font-family: 'Oswald', sans-serif; }
  .pt-mono { font-family: 'JetBrains Mono', monospace; }
  .pt-body { font-family: 'Inter', sans-serif; }
  .chip { transition: all 0.15s ease; }
  .chip:active { transform: scale(0.93); }
  .sheet-enter { animation: slideUp 0.25s ease-out; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .card-in { animation: fadeIn 0.2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  input:focus, button:focus-visible { outline: 2px solid #FF7A33; outline-offset: 2px; }
  ::placeholder { color: #6B7378; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ---------- tiny inline icons (no external icon library needed) ---------- */
const Icon = ({ children, size = 16, color = "currentColor", strokeWidth = 2 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" /></Icon>;
const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></Icon>;
const Dumbbell = (p) => <Icon {...p}><path d="M6.5 6.5 17.5 17.5" /><path d="M14 4l6 6" /><path d="M4 14l6 6" /><path d="M2 8l4-4" /><path d="M20 16l-4 4" /><path d="M12 4l4 4" /></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const CalendarIcon = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></Icon>;
const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6" /></Icon>;
const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6" /></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" /></Icon>;
const RefreshIcon = (p) => <Icon {...p}><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></Icon>;

/* ---------- data ---------- */
const DAYS = [
  { key: "seg", label: "SEG", full: "Segunda" }, { key: "ter", label: "TER", full: "Terça" },
  { key: "qua", label: "QUA", full: "Quarta" }, { key: "qui", label: "QUI", full: "Quinta" },
  { key: "sex", label: "SEX", full: "Sexta" }, { key: "sab", label: "SÁB", full: "Sábado" },
  { key: "dom", label: "DOM", full: "Domingo" },
];
const emptyDays = () => DAYS.reduce((acc, d) => ({ ...acc, [d.key]: false }), {});
const HOURS = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
const MINUTES = ["00", "05", "10", "15", "20", "25", "30", "35", "40", "45", "50", "55"];
const STORAGE_KEY = "pt-alunos-v1";
const formatBRL = (v) => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const MAX_PERSONAL_PER_SLOT = 1;
const MAX_ASSISTIDO_PER_SLOT = 3;

function App() {
  const [students, setStudents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [showAgenda, setShowAgenda] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ name: "", type: "personal", fee: "", time: "", days: emptyDays() });
  const [saveError, setSaveError] = useState(false);
  const [formError, setFormError] = useState("");
  const [viewMonth, setViewMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [amountEdit, setAmountEdit] = useState(null); // { studentId, name }
  const [amountDraft, setAmountDraft] = useState("");
  const [filterPending, setFilterPending] = useState(false);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) setStudents(JSON.parse(raw));
    } catch (e) {
      // sem dados salvos ainda — tudo bem
    } finally {
      setLoading(false);
    }
  }, []);

  function persist(next) {
    setStudents(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  }

  function openNew() {
    setEditingId(null);
    setFormError("");
    setForm({ name: "", type: "personal", fee: "", time: "", days: emptyDays() });
    setShowForm(true);
  }
  function openEdit(s) {
    setEditingId(s.id);
    setFormError("");
    setForm({ name: s.name, type: s.type, fee: s.fee ?? "", time: s.time || "", days: { ...s.days } });
    setShowForm(true);
  }
  function toggleDay(key) {
    setForm((f) => ({ ...f, days: { ...f.days, [key]: !f.days[key] } }));
  }

  // ---- capacidade de horário: 1 personal + até 3 assistidos por (dia, horário) ----
  function slotOccupants(dayKey, time, excludeId) {
    return students.filter((s) => s.id !== excludeId && s.time === time && s.days[dayKey]);
  }
  function slotHasSpace(dayKey, time, type, excludeId) {
    const occ = slotOccupants(dayKey, time, excludeId);
    if (type === "personal") return occ.filter((o) => o.type === "personal").length < MAX_PERSONAL_PER_SLOT;
    return occ.filter((o) => o.type === "assistido").length < MAX_ASSISTIDO_PER_SLOT;
  }

  function saveForm() {
    if (!form.name.trim()) { setFormError("Digite o nome do aluno."); return; }
    const fee = Number(form.fee) || 0;

    if (form.time) {
      const conflictDay = DAYS.find((d) => form.days[d.key] && !slotHasSpace(d.key, form.time, form.type, editingId));
      if (conflictDay) {
        const label = form.type === "personal" ? "já tem 1 personal" : "já tem 3 assistidos";
        setFormError(`${conflictDay.full} às ${form.time} ${label} nesse horário.`);
        return;
      }
    }
    setFormError("");

    if (editingId) {
      persist(students.map((s) => (s.id === editingId ? { ...s, ...form, fee } : s)));
    } else {
      persist([...students, { id: Date.now().toString(), ...form, fee, payments: {} }]);
    }
    setShowForm(false);
  }
  function removeStudent(id) {
    persist(students.filter((s) => s.id !== id));
  }

  const today = new Date();
  const monthKey = `${viewMonth.getFullYear()}-${String(viewMonth.getMonth() + 1).padStart(2, "0")}`;
  const monthName = viewMonth.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  const isCurrentMonth = viewMonth.getFullYear() === today.getFullYear() && viewMonth.getMonth() === today.getMonth();
  function goMonth(delta) {
    setViewMonth((d) => { const n = new Date(d); n.setMonth(n.getMonth() + delta); return n; });
  }

  const isPaid = (s) => !!(s.payments && s.payments[monthKey]);
  function togglePaid(s) {
    const payments = { ...(s.payments || {}), [monthKey]: !isPaid(s) };
    persist(students.map((st) => (st.id === s.id ? { ...st, payments } : st)));
  }

  // valor cobrado desse aluno no mês em exibição — usa override do mês se existir, senão o valor padrão
  const amountFor = (s) => (s.amounts && s.amounts[monthKey] != null) ? s.amounts[monthKey] : (s.fee || 0);

  function openAmountEdit(s) {
    setAmountEdit({ studentId: s.id, name: s.name });
    setAmountDraft(String(amountFor(s)));
  }
  function saveAmount() {
    if (!amountEdit) return;
    const val = Number(amountDraft) || 0;
    persist(students.map((s) => (s.id === amountEdit.studentId ? { ...s, amounts: { ...(s.amounts || {}), [monthKey]: val } } : s)));
    setAmountEdit(null);
  }
  function resetAmountToDefault() {
    if (!amountEdit) return;
    persist(students.map((s) => {
      if (s.id !== amountEdit.studentId) return s;
      const amounts = { ...(s.amounts || {}) };
      delete amounts[monthKey];
      return { ...s, amounts };
    }));
    setAmountEdit(null);
  }

  const personalStudents = students.filter((s) => s.type === "personal");
  const assistidoStudents = students.filter((s) => s.type === "assistido");
  const personalCount = personalStudents.length;
  const assistidoCount = assistidoStudents.length;
  const personalValue = personalStudents.reduce((sum, s) => sum + amountFor(s), 0);
  const assistidoValue = assistidoStudents.reduce((sum, s) => sum + amountFor(s), 0);

  const weeklyTotal = (s) => Object.values(s.days).filter(Boolean).length;
  const grandTotal = students.reduce((sum, s) => sum + weeklyTotal(s), 0);
  const dayCounts = DAYS.map((d) => ({ ...d, count: students.filter((s) => s.days[d.key]).length }));
  const maxDay = Math.max(1, ...dayCounts.map((d) => d.count));
  const busiest = dayCounts.reduce((a, b) => (b.count > a.count ? b : a), dayCounts[0]);

  const expected = students.reduce((sum, s) => sum + amountFor(s), 0);
  const received = students.reduce((sum, s) => sum + (isPaid(s) ? amountFor(s) : 0), 0);
  const pending = expected - received;
  const pendingCount = students.filter((s) => !isPaid(s)).length;
  const pct = expected > 0 ? Math.round((received / expected) * 100) : 0;
  const visibleStudents = filterPending ? students.filter((s) => !isPaid(s)) : students;

  // ---- agenda: dias com alunos, agrupados por horário ----
  const agendaDays = DAYS.map((d) => {
    const dayStudents = students.filter((s) => s.days[d.key]);
    const slots = {};
    dayStudents.forEach((s) => {
      const t = s.time || "sem horário";
      if (!slots[t]) slots[t] = [];
      slots[t].push(s);
    });
    const times = Object.keys(slots).sort();
    return { ...d, times, slots };
  }).filter((d) => d.times.length > 0);

  return (
    <div style={styles.app}>
      {/* Header */}
      <div style={styles.header}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div className="pt-body" style={{ fontSize: 12, letterSpacing: 1.5, color: "#9BA3A8", marginBottom: 4 }}>
              PAINEL DO PERSONAL
            </div>
            <h1 className="pt-display" style={styles.title}>
              GESTÃO DE <span style={{ color: "#FF7A33" }}>ALUNOS</span>
            </h1>
          </div>
          <button onClick={() => { window.location.href = window.location.pathname + "?v=" + Date.now(); }}
            className="chip" style={styles.refreshBtn} aria-label="Buscar atualização do app">
            <RefreshIcon size={16} color="#9BA3A8" />
          </button>
        </div>

        <div style={{ ...styles.statsGrid, gridTemplateColumns: "1fr 1fr 1fr" }}>
          <div style={styles.statBox}>
            <div className="pt-mono" style={styles.statNum}>{students.length}</div>
            <div style={styles.statLabel}>alunos ativos</div>
          </div>
          <div style={styles.statBox}>
            <div className="pt-mono" style={styles.statNum}>{grandTotal}</div>
            <div style={styles.statLabel}>sessões / semana</div>
          </div>
          <div style={styles.statBox}>
            <div className="pt-mono" style={{ ...styles.statNum, fontSize: 20 }}>
              {students.length ? busiest.label : "—"}
            </div>
            <div style={styles.statLabel}>dia mais cheio</div>
          </div>
        </div>

        {/* Resumo por tipo: personal x assistido */}
        {students.length > 0 && (
          <div style={styles.typeGrid}>
            <div style={{ ...styles.typeCard, borderColor: "rgba(255,122,51,0.35)" }}>
              <div className="pt-body" style={{ ...styles.typeLabel, color: "#FF7A33" }}>PERSONAL</div>
              <div className="pt-mono" style={{ ...styles.typeCount, color: "#FF7A33" }}>{personalCount}</div>
              <div className="pt-mono" style={styles.typeValue}>{formatBRL(personalValue)}</div>
            </div>
            <div style={{ ...styles.typeCard, borderColor: "rgba(79,169,224,0.35)" }}>
              <div className="pt-body" style={{ ...styles.typeLabel, color: "#4FA9E0" }}>ASSISTIDO</div>
              <div className="pt-mono" style={{ ...styles.typeCount, color: "#4FA9E0" }}>{assistidoCount}</div>
              <div className="pt-mono" style={styles.typeValue}>{formatBRL(assistidoValue)}</div>
            </div>
          </div>
        )}

        {/* Painel financeiro do mês */}
        <div style={styles.moneyPanel}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <button onClick={() => goMonth(-1)} className="chip" style={styles.monthNavBtn} aria-label="Mês anterior">
                <ChevronLeft size={14} color="#9BA3A8" />
              </button>
              <span className="pt-body" style={{ fontSize: 11.5, letterSpacing: 1, color: "#9BA3A8", textTransform: "uppercase" }}>
                Cobrança de {monthName}
              </span>
              <button onClick={() => goMonth(1)} disabled={isCurrentMonth} className="chip" style={{ ...styles.monthNavBtn, opacity: isCurrentMonth ? 0.25 : 1 }} aria-label="Próximo mês">
                <ChevronRight size={14} color="#9BA3A8" />
              </button>
            </div>
            {pendingCount > 0 && (
              <span className="pt-body" style={{ fontSize: 11, color: "#E05252" }}>
                {pendingCount} pendente{pendingCount > 1 ? "s" : ""}
              </span>
            )}
          </div>
          <div style={styles.moneyRow}>
            <div>
              <div className="pt-mono" style={{ ...styles.moneyNum, color: "#7CC576" }}>{formatBRL(received)}</div>
              <div style={styles.statLabel}>recebido</div>
            </div>
            <div>
              <div className="pt-mono" style={{ ...styles.moneyNum, color: pending > 0 ? "#E05252" : "#9BA3A8" }}>{formatBRL(pending)}</div>
              <div style={styles.statLabel}>a receber</div>
            </div>
            <div>
              <div className="pt-mono" style={{ ...styles.moneyNum, color: "#ECEEEF" }}>{formatBRL(expected)}</div>
              <div style={styles.statLabel}>previsto</div>
            </div>
          </div>
          <div style={styles.progressTrack}>
            <div style={{ ...styles.progressFill, width: `${pct}%` }} />
          </div>
        </div>

        {students.length > 0 && (
          <div style={styles.loadRow}>
            {dayCounts.map((d) => (
              <div key={d.key} style={styles.loadCol}>
                <div className="pt-mono" style={styles.loadCount}>{d.count || ""}</div>
                <div style={styles.loadTrack}>
                  <div style={{ ...styles.loadFill, height: `${(d.count / maxDay) * 100}%`, opacity: d.count === 0 ? 0.15 : 1 }} />
                </div>
                <div style={styles.loadLabel}>{d.label[0]}</div>
              </div>
            ))}
          </div>
        )}

        {agendaDays.length > 0 && (
          <button onClick={() => setShowAgenda(true)} className="chip pt-body" style={styles.agendaBtn}>
            <CalendarIcon size={14} style={{ marginRight: 6 }} />Ver agenda de horários
          </button>
        )}
      </div>

      {/* List */}
      <div style={{ padding: "16px 16px 100px" }}>
        {loading && (
          <div className="pt-body" style={{ color: "#9BA3A8", textAlign: "center", padding: 40 }}>Carregando...</div>
        )}

        {!loading && students.length > 0 && (
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            <button onClick={() => setFilterPending(false)} className="chip pt-body"
              style={{ ...styles.filterChip, background: !filterPending ? "#2F363B" : "transparent", color: !filterPending ? "#ECEEEF" : "#6B7378" }}>
              Todos ({students.length})
            </button>
            <button onClick={() => setFilterPending(true)} className="chip pt-body"
              style={{ ...styles.filterChip, background: filterPending ? "rgba(224,82,82,0.15)" : "transparent", color: filterPending ? "#E05252" : "#6B7378" }}>
              Pendentes ({pendingCount})
            </button>
          </div>
        )}

        {!loading && students.length === 0 && (
          <div style={styles.empty}>
            <Dumbbell size={28} color="#4A5257" />
            <div className="pt-body" style={{ color: "#9BA3A8", marginTop: 12, fontSize: 14, lineHeight: 1.5 }}>
              Nenhum aluno cadastrado ainda.<br />Toque em + para adicionar o primeiro.
            </div>
          </div>
        )}

        {!loading && students.length > 0 && visibleStudents.length === 0 && (
          <div style={styles.empty}>
            <Check size={26} color="#7CC576" />
            <div className="pt-body" style={{ color: "#9BA3A8", marginTop: 12, fontSize: 14 }}>Ninguém pendente esse mês.</div>
          </div>
        )}

        {visibleStudents.map((s) => (
          <div key={s.id} className="card-in" style={styles.card} onClick={() => openEdit(s)}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <span className="pt-display" style={styles.cardName}>{s.name}</span>
                  <span className="pt-body" style={{
                    ...styles.badge,
                    background: s.type === "personal" ? "rgba(255,122,51,0.15)" : "rgba(79,169,224,0.15)",
                    color: s.type === "personal" ? "#FF7A33" : "#4FA9E0",
                  }}>
                    {s.type === "personal" ? "Personal" : "Assistido"}
                  </span>
                </div>
                <div style={{ display: "flex", gap: 12, marginTop: 3, flexWrap: "wrap" }}>
                  {s.time && (
                    <div className="pt-body pt-mono" style={styles.metaLine}>
                      <Clock size={11} style={{ marginRight: 4 }} />{s.time}
                    </div>
                  )}
                </div>
              </div>
              <button onClick={(e) => { e.stopPropagation(); removeStudent(s.id); }} style={styles.trashBtn} aria-label={`Remover ${s.name}`}>
                <Trash2 size={15} color="#6B7378" />
              </button>
            </div>

            <div style={styles.cardBottom}>
              <div style={{ display: "flex", gap: 5 }}>
                {DAYS.map((d) => (
                  <div key={d.key} style={{
                    ...styles.dayDot,
                    background: s.days[d.key] ? "#FF7A33" : "#33393E",
                    color: s.days[d.key] ? "#1B1F22" : "#6B7378",
                  }}>
                    {d.label[0]}
                  </div>
                ))}
              </div>
              <div className="pt-mono" style={styles.totalNum}>
                {weeklyTotal(s)}<span style={{ fontSize: 11, color: "#6B7378" }}>/sem</span>
              </div>
            </div>

            <div style={styles.moneyLine}>
              <button onClick={(e) => { e.stopPropagation(); openAmountEdit(s); }} className="chip pt-mono" style={styles.amountBtn}>
                {formatBRL(amountFor(s))}
                {s.amounts && s.amounts[monthKey] != null && <span style={styles.overrideDot} title="Valor diferente do padrão neste mês" />}
                <Pencil size={11} color="#6B7378" style={{ marginLeft: 6 }} />
              </button>
              <button onClick={(e) => { e.stopPropagation(); togglePaid(s); }} className="chip pt-body" style={{
                ...styles.payChip,
                background: isPaid(s) ? "rgba(124,197,118,0.15)" : "rgba(224,82,82,0.15)",
                color: isPaid(s) ? "#7CC576" : "#E05252",
              }}>
                {isPaid(s) ? <><Check size={12} style={{ marginRight: 3 }} />Pago</> : "Pendente"}
              </button>
            </div>
          </div>
        ))}
      </div>

      <button onClick={openNew} style={styles.fab} aria-label="Adicionar aluno">
        <Plus size={26} color="#1B1F22" strokeWidth={2.5} />
      </button>

      {/* Form sheet */}
      {showForm && (
        <div style={styles.overlay} onClick={() => setShowForm(false)}>
          <div className="sheet-enter" style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <span className="pt-display" style={{ fontSize: 18, letterSpacing: 0.5, color: "#ECEEEF" }}>
                {editingId ? "EDITAR ALUNO" : "NOVO ALUNO"}
              </span>
              <button onClick={() => setShowForm(false)} style={styles.closeBtn}><X size={18} color="#9BA3A8" /></button>
            </div>

            <label className="pt-body" style={styles.fieldLabel}>Nome</label>
            <input className="pt-body" style={styles.input} value={form.name}
              onChange={(e) => setForm((f) => ({ ...f, name: e.target.value }))} placeholder="Nome do aluno" autoFocus />

            <label className="pt-body" style={styles.fieldLabel}>Tipo</label>
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              {["personal", "assistido"].map((t) => (
                <button key={t} onClick={() => setForm((f) => ({ ...f, type: t }))} className="chip pt-body" style={{
                  ...styles.typeBtn,
                  background: form.type === t ? "#FF7A33" : "#2F363B",
                  color: form.type === t ? "#1B1F22" : "#9BA3A8",
                }}>
                  {t === "personal" ? "Personal" : "Assistido"}
                </button>
              ))}
            </div>

            <label className="pt-body" style={styles.fieldLabel}>Horário (opcional)</label>
            <div style={{ display: "flex", gap: 8, marginBottom: 6 }}>
              <select className="pt-mono" style={styles.select} value={form.time.split(":")[0] || ""}
                onChange={(e) => {
                  const h = e.target.value;
                  const m = form.time.split(":")[1] || "00";
                  setForm((f) => ({ ...f, time: h ? `${h}:${m}` : "" }));
                }}>
                <option value="">Hora</option>
                {HOURS.map((h) => <option key={h} value={h}>{h}h</option>)}
              </select>
              <select className="pt-mono" style={styles.select} value={form.time.split(":")[1] || ""}
                onChange={(e) => {
                  const m = e.target.value;
                  const h = form.time.split(":")[0] || "00";
                  setForm((f) => ({ ...f, time: `${h}:${m}` }));
                }}>
                <option value="">Min</option>
                {MINUTES.map((m) => <option key={m} value={m}>{m}min</option>)}
              </select>
            </div>
            <div className="pt-body" style={{ fontSize: 11, color: "#6B7378", marginBottom: 14 }}>
              Com horário preenchido, o app avisa se o slot já estiver cheio (1 personal ou 3 assistidos).
            </div>

            <label className="pt-body" style={styles.fieldLabel}>Valor mensal (R$)</label>
            <input className="pt-body" style={styles.input} type="number" inputMode="decimal" value={form.fee}
              onChange={(e) => setForm((f) => ({ ...f, fee: e.target.value }))} placeholder="0,00" />

            <label className="pt-body" style={styles.fieldLabel}>Dias que vai treinar</label>
            <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
              {DAYS.map((d) => (
                <button key={d.key} onClick={() => toggleDay(d.key)} className="chip pt-mono" style={{
                  ...styles.dayToggle,
                  background: form.days[d.key] ? "#FF7A33" : "#2F363B",
                  color: form.days[d.key] ? "#1B1F22" : "#9BA3A8",
                }}>
                  {d.label}
                </button>
              ))}
            </div>

            {formError && (
              <div className="pt-body" style={styles.formErrorBox}>{formError}</div>
            )}

            <button onClick={saveForm} className="pt-display" style={styles.saveBtn}>SALVAR</button>
            {saveError && (
              <div className="pt-body" style={{ color: "#E05252", fontSize: 12, marginTop: 8, textAlign: "center" }}>
                Não deu pra salvar agora. Tenta de novo.
              </div>
            )}
          </div>
        </div>
      )}

      {/* Agenda sheet */}
      {showAgenda && (
        <div style={styles.overlay} onClick={() => setShowAgenda(false)}>
          <div className="sheet-enter" style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <span className="pt-display" style={{ fontSize: 18, letterSpacing: 0.5, color: "#ECEEEF" }}>AGENDA DE HORÁRIOS</span>
              <button onClick={() => setShowAgenda(false)} style={styles.closeBtn}><X size={18} color="#9BA3A8" /></button>
            </div>

            {agendaDays.map((d) => (
              <div key={d.key} style={{ marginBottom: 18 }}>
                <div className="pt-display" style={{ fontSize: 13, letterSpacing: 1, color: "#FF7A33", marginBottom: 8 }}>
                  {d.full.toUpperCase()}
                </div>
                {d.times.map((t) => {
                  const occ = d.slots[t];
                  const pCount = occ.filter((o) => o.type === "personal").length;
                  const aCount = occ.filter((o) => o.type === "assistido").length;
                  return (
                    <div key={t} style={styles.agendaSlot}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                        <span className="pt-mono" style={{ fontSize: 13, color: "#ECEEEF", fontWeight: 700 }}>{t}</span>
                        <span className="pt-mono" style={{ fontSize: 10.5, color: "#6B7378" }}>
                          {pCount}/{MAX_PERSONAL_PER_SLOT} pers · {aCount}/{MAX_ASSISTIDO_PER_SLOT} assist
                        </span>
                      </div>
                      {occ.map((o) => (
                        <div key={o.id} className="pt-body" style={{ fontSize: 12.5, color: "#9BA3A8", padding: "2px 0" }}>
                          <span style={{ color: o.type === "personal" ? "#FF7A33" : "#4FA9E0" }}>●</span> {o.name}
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Editar valor do mês */}
      {amountEdit && (
        <div style={styles.overlay} onClick={() => setAmountEdit(null)}>
          <div className="sheet-enter" style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <span className="pt-display" style={{ fontSize: 18, letterSpacing: 0.5, color: "#ECEEEF" }}>
                VALOR — {monthName.toUpperCase()}
              </span>
              <button onClick={() => setAmountEdit(null)} style={styles.closeBtn}><X size={18} color="#9BA3A8" /></button>
            </div>
            <div className="pt-body" style={{ fontSize: 13, color: "#9BA3A8", marginBottom: 14 }}>{amountEdit.name}</div>
            <label className="pt-body" style={styles.fieldLabel}>Valor cobrado neste mês (R$)</label>
            <input className="pt-body" style={styles.input} type="number" inputMode="decimal" value={amountDraft}
              onChange={(e) => setAmountDraft(e.target.value)} placeholder="0,00" autoFocus />
            <button onClick={saveAmount} className="pt-display" style={styles.saveBtn}>SALVAR</button>
            <button onClick={resetAmountToDefault} className="pt-body" style={styles.resetAmountBtn}>
              Usar valor padrão do aluno
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

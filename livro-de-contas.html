<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Livro de Contas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap');

:root{
  --ink-cover: #20302A;
  --ink-cover-2: #2A3D35;
  --paper: #F3ECDA;
  --paper-2: #FAF5E8;
  --paper-line: #D8C9A3;
  --ink-text: #2B2A22;
  --ink-muted: #7A7256;
  --copper: #C1663B;
  --copper-dark: #A34F2A;
  --green: #3E7D5A;
  --red: #B23A2E;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  font-family:'Space Mono', monospace;
  color: var(--ink-text);
  background: var(--ink-cover);
}

h1,h2,h3, .display{
  font-family:'Fraunces', serif;
  font-weight:600;
  margin:0;
}

.app{
  display:flex;
  min-height:100vh;
}

/* ---- Sidebar / cover ---- */
.cover{
  width:300px;
  flex-shrink:0;
  background: var(--ink-cover);
  color: var(--paper);
  padding: 32px 26px;
  display:flex;
  flex-direction:column;
  gap:28px;
}

.cover-title{
  font-size: 1.7rem;
  line-height:1.15;
}
.cover-sub{
  color: #9AA6B8;
  font-size: 0.8rem;
  margin-top:6px;
}

.month-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background: var(--ink-cover-2);
  border-radius: 6px;
  padding: 10px 8px;
}
.month-nav button{
  background:none;
  border:none;
  color: var(--paper);
  font-size:1.3rem;
  cursor:pointer;
  padding: 2px 10px;
  line-height:1;
}
.month-nav button:hover{ color: var(--copper); }
.month-label{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:0.95rem;
  text-align:center;
}

.saldo-block{
  border-top: 1px solid rgba(255,255,255,0.14);
  padding-top:20px;
}
.saldo-label{
  font-size:0.78rem;
  color:#9AA6B8;
  margin-bottom:6px;
}
.saldo-value{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:2rem;
}
.saldo-value.pos{ color:#7FBF9E; }
.saldo-value.neg{ color:#E08E7D; }

.cat-totals{
  display:flex;
  flex-direction:column;
  gap:0;
  border-top: 1px solid rgba(255,255,255,0.14);
  padding-top: 8px;
}
.cat-row{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  font-size:0.85rem;
}
.cat-row .cat-name{ color:#C9D2DE; }
.cat-row .cat-amt{ color: var(--paper); }

.btn-add{
  margin-top:auto;
  background: var(--copper);
  color: #fff;
  border:none;
  border-radius:6px;
  padding:13px 16px;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:0.95rem;
  cursor:pointer;
}
.btn-add:hover{ background: var(--copper-dark); }

.btn-toggle-view{
  background: none;
  border: 1px solid rgba(255,255,255,0.25);
  color: var(--paper);
  border-radius:6px;
  padding:9px 10px;
  font-family:'Space Mono', monospace;
  font-size:0.8rem;
  cursor:pointer;
}
.btn-toggle-view:hover{ border-color: var(--copper); color: var(--copper); }

/* ---- Main paper ---- */
.paper{
  flex:1;
  background: var(--paper);
  padding: 40px 48px 60px;
  box-shadow: -6px 0 24px rgba(0,0,0,0.18);
}

.paper-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:16px;
  padding-bottom:20px;
  border-bottom: 2px solid var(--ink-text);
  margin-bottom: 6px;
}

.paper-month{
  font-size:1.5rem;
}

.stat-row{
  display:flex;
  gap:28px;
  margin-top:10px;
}
.stat{
  font-size:0.82rem;
  color: var(--ink-muted);
}
.stat span{
  display:block;
  font-size:1rem;
  color: var(--ink-text);
  margin-top:2px;
}

.saldo-mes{
  text-align:right;
}
.saldo-mes .lbl{
  font-size:0.78rem;
  color: var(--ink-muted);
}
.saldo-mes .val{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:1.6rem;
}
.saldo-mes .val.pos{ color: var(--green); }
.saldo-mes .val.neg{ color: var(--red); }

.ledger{ margin-top: 8px; }

.ledger-row{
  display:grid;
  grid-template-columns: 70px 1fr 130px 28px;
  gap:14px;
  align-items:center;
  padding: 14px 6px;
  border-bottom: 1px solid var(--paper-line);
  cursor:pointer;
}
.ledger-row:hover{ background: var(--paper-2); }

.row-date{ color: var(--ink-muted); font-size:0.85rem; }
.row-desc .desc-main{ display:block; font-size:0.95rem; }
.row-desc .desc-cat{ display:block; font-size:0.75rem; color: var(--ink-muted); margin-top:2px; font-family:'Space Mono',monospace; }
.row-value{ text-align:right; font-size:0.95rem; }
.row-value.pos{ color: var(--green); }
.row-value.neg{ color: var(--red); }

.row-del{
  background:none;
  border:none;
  color: var(--ink-muted);
  font-size:1.1rem;
  cursor:pointer;
  padding:4px;
}
.row-del:hover{ color: var(--red); }

.empty-state{
  padding: 60px 10px;
  text-align:center;
  color: var(--ink-muted);
}
.empty-state button{
  margin-top:14px;
  background:none;
  border:1px solid var(--ink-muted);
  color: var(--ink-text);
  border-radius:6px;
  padding:9px 16px;
  font-family:'Space Mono',monospace;
  cursor:pointer;
}

/* ---- Modal ---- */
.modal-backdrop{
  position:fixed; inset:0;
  background: rgba(27,36,48,0.55);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  z-index:10;
}
.modal{
  background: var(--paper-2);
  border-radius:8px;
  padding: 28px 26px;
  width:100%;
  max-width: 380px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.modal h2{ font-size:1.3rem; }

.type-toggle{
  display:flex;
  gap:8px;
}
.type-toggle button{
  flex:1;
  padding:10px 8px;
  border-radius:6px;
  border:1px solid var(--paper-line);
  background: var(--paper);
  color: var(--ink-text);
  font-family:'Space Mono',monospace;
  font-size:0.85rem;
  cursor:pointer;
}
.type-toggle button.active[data-type="recebimento"]{
  background: var(--green); border-color: var(--green); color:#fff;
}
.type-toggle button.active[data-type="conta"]{
  background: var(--red); border-color: var(--red); color:#fff;
}

.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:0.78rem; color: var(--ink-muted); }
.field input, .field select{
  font-family:'Space Mono',monospace;
  font-size:0.95rem;
  padding:10px 10px;
  border-radius:6px;
  border:1px solid var(--paper-line);
  background:#fff;
  color: var(--ink-text);
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:6px;
}
.modal-actions button{
  flex:1;
  padding:11px 10px;
  border-radius:6px;
  border:none;
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:0.92rem;
  cursor:pointer;
}
.btn-save{ background: var(--copper); color: #fff; }
.btn-save:hover{ background: var(--copper-dark); }
.btn-cancel{ background:none; border:1px solid var(--paper-line) !important; color: var(--ink-text); }
.btn-delete{ background:none; border:1px solid var(--red) !important; color: var(--red); }

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background: var(--ink-cover); color: var(--paper);
  padding:10px 18px; border-radius:6px; font-size:0.85rem;
  opacity:0; pointer-events:none; transition:opacity 0.3s;
  z-index:20;
}
.toast.show{ opacity:1; }

.year-row{
  display:grid;
  grid-template-columns: 100px 1fr 120px;
  gap:14px;
  align-items:center;
  padding: 13px 6px;
  border-bottom: 1px solid var(--paper-line);
  cursor:pointer;
}
.year-row:hover{ background: var(--paper-2); }
.year-row-month{ font-family:'Fraunces', serif; font-size:0.95rem; }
.bar-track{
  height:8px;
  background: rgba(43,42,34,0.08);
  border-radius:4px;
  overflow:hidden;
}
.bar-fill{ height:100%; border-radius:4px; }
.bar-fill.pos{ background: var(--green); }
.bar-fill.neg{ background: var(--red); }
.year-row-saldo{ text-align:right; font-size:0.95rem; }
.year-row-saldo.pos{ color: var(--green); }
.year-row-saldo.neg{ color: var(--red); }
.year-total{
  display:flex;
  justify-content:space-between;
  padding: 16px 6px 4px;
  margin-top: 6px;
  border-top: 2px solid var(--ink-text);
  font-family:'Fraunces', serif;
  font-size:1.1rem;
}
.year-total .val.pos{ color: var(--green); }
.year-total .val.neg{ color: var(--red); }

@media (max-width: 760px){
  .app{ flex-direction:column; }
  .cover{ width:auto; }
  .paper{ padding:28px 20px 50px; box-shadow:none; }
  .ledger-row{ grid-template-columns: 60px 1fr 100px 22px; gap:8px; }
  .year-row{ grid-template-columns: 80px 1fr 100px; gap:8px; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="cover">
    <div>
      <div class="cover-title">Livro de Contas</div>
      <div class="cover-sub">receitas e contas da casa</div>
    </div>

    <div class="month-nav">
      <button id="prevMonth" aria-label="Anterior">‹</button>
      <div class="month-label" id="monthLabel">—</div>
      <button id="nextMonth" aria-label="Próximo">›</button>
    </div>

    <button class="btn-toggle-view" id="toggleView">Ver resumo do ano</button>

    <div class="saldo-block">
      <div class="saldo-label" id="saldoLabel">Saldo acumulado até este mês</div>
      <div class="saldo-value" id="saldoAcumulado">R$ 0,00</div>
    </div>

    <div class="cat-totals" id="catTotals"></div>

    <button class="btn-add" id="openAdd">+ Novo lançamento</button>
  </aside>

  <main class="paper">
    <div class="paper-header">
      <div>
        <h2 class="paper-month" id="paperMonth">—</h2>
        <div class="stat-row" id="paperHeaderStats">
          <div class="stat">Recebimentos<span id="statReceitas">R$ 0,00</span></div>
          <div class="stat">Contas<span id="statDespesas">R$ 0,00</span></div>
        </div>
      </div>
      <div class="saldo-mes">
        <div class="lbl">Saldo do mês</div>
        <div class="val" id="saldoMes">R$ 0,00</div>
      </div>
    </div>

    <div class="ledger" id="ledgerRows"></div>

    <div class="empty-state" id="emptyState" hidden>
      Nada lançado neste mês ainda.
      <br>
      <button id="emptyAdd">Adicionar o primeiro lançamento</button>
    </div>

    <div id="yearRows" hidden></div>
    <div class="year-total" id="yearTotal" hidden>
      <span>Saldo do ano</span>
      <span class="val" id="yearTotalVal">R$ 0,00</span>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <form class="modal" id="txForm">
    <h2 id="modalTitle">Novo lançamento</h2>

    <div class="type-toggle">
      <button type="button" data-type="recebimento" id="btnRecebimento">Recebimento</button>
      <button type="button" data-type="conta" id="btnConta">Conta</button>
    </div>

    <div class="field" id="fieldCategoria">
      <label for="inputCategoria">Categoria</label>
      <select id="inputCategoria">
        <option>Casa</option>
        <option>Escola</option>
        <option>Aluguel</option>
        <option>Mercado</option>
        <option>Transporte</option>
        <option>Saúde</option>
        <option>Lazer</option>
        <option>Internet/Telefone</option>
        <option>Outras contas</option>
      </select>
    </div>

    <div class="field">
      <label for="inputDescricao">Descrição</label>
      <input type="text" id="inputDescricao" placeholder="Ex.: aluguel de setembro" required>
    </div>

    <div class="field">
      <label for="inputData">Data</label>
      <input type="date" id="inputData" required>
    </div>

    <div class="field">
      <label for="inputValor">Valor (R$)</label>
      <input type="number" id="inputValor" step="0.01" min="0" placeholder="0,00" required>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
      <button type="button" class="btn-delete" id="btnDelete" hidden>Excluir</button>
      <button type="submit" class="btn-save">Salvar</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DESPESA_CATS = ['Casa','Escola','Aluguel','Mercado','Transporte','Saúde','Lazer','Internet/Telefone','Outras contas'];

let state = {
  transactions: [],
  viewYear: new Date().getFullYear(),
  viewMonth: new Date().getMonth(),
  viewMode: 'mes', // 'mes' | 'ano'
  editingId: null,
};

const fmtMoney = v => new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' }).format(v);
const monthKey = (y,m) => y + '-' + String(m+1).padStart(2,'0');
const txMonthKey = t => { const d = new Date(t.date+'T00:00:00'); return monthKey(d.getFullYear(), d.getMonth()); };
const fmtDateShort = iso => { const d = new Date(iso+'T00:00:00'); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); };

async function loadData(){
  try{
    const r = await window.storage.get('lancamentos');
    state.transactions = r ? JSON.parse(r.value) : [];
  }catch(e){
    state.transactions = [];
  }
  render();
}

async function saveData(){
  try{
    const ok = await window.storage.set('lancamentos', JSON.stringify(state.transactions));
    if(!ok) showToast('Não foi possível salvar agora.');
  }catch(e){
    showToast('Não foi possível salvar agora.');
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2600);
}

function getMonthTransactions(y,m){
  return state.transactions.filter(t => txMonthKey(t) === monthKey(y,m))
    .sort((a,b)=> a.date.localeCompare(b.date));
}

function getMonthTotals(y,m){
  const entries = getMonthTransactions(y,m);
  let receitas=0, despesas=0;
  entries.forEach(t=>{ if(t.type==='recebimento') receitas+=t.value; else despesas+=t.value; });
  return { receitas, despesas, saldo: receitas-despesas, entries };
}

function getAccumulatedBalance(y,m){
  const cutoff = new Date(y, m+1, 0, 23,59,59);
  let total = 0;
  state.transactions.forEach(t=>{
    const d = new Date(t.date+'T00:00:00');
    if(d <= cutoff) total += (t.type==='recebimento' ? t.value : -t.value);
  });
  return total;
}

function getCategoryTotalsForEntries(entries){
  const totals = {};
  DESPESA_CATS.forEach(c=> totals[c]=0);
  entries.forEach(t=>{ if(t.type==='conta') totals[t.category] = (totals[t.category]||0) + t.value; });
  return totals;
}

function getYearTransactions(y){
  return state.transactions.filter(t => new Date(t.date+'T00:00:00').getFullYear() === y);
}

function getYearTotals(y){
  const monthly = [];
  let receitas = 0, despesas = 0;
  for(let m=0; m<12; m++){
    const mt = getMonthTotals(y,m);
    monthly.push(mt);
    receitas += mt.receitas;
    despesas += mt.despesas;
  }
  return { receitas, despesas, saldo: receitas-despesas, monthly };
}

function render(){
  const { viewYear:y, viewMonth:m, viewMode } = state;

  document.getElementById('toggleView').textContent = viewMode === 'ano' ? 'Ver mês' : 'Ver resumo do ano';
  document.getElementById('monthLabel').textContent = viewMode === 'ano' ? String(y) : (MESES[m] + ' ' + y);

  // sidebar: accumulated balance + category totals cover the whole year in 'ano' mode
  const accumMonth = viewMode === 'ano' ? 11 : m;
  document.getElementById('saldoLabel').textContent = viewMode === 'ano'
    ? 'Saldo acumulado até o fim do ano'
    : 'Saldo acumulado até este mês';
  const acumulado = getAccumulatedBalance(y, accumMonth);
  const acumEl = document.getElementById('saldoAcumulado');
  acumEl.textContent = fmtMoney(acumulado);
  acumEl.className = 'saldo-value ' + (acumulado >= 0 ? 'pos' : 'neg');

  const catSourceEntries = viewMode === 'ano' ? getYearTransactions(y) : getMonthTransactions(y,m);
  const catTotals = getCategoryTotalsForEntries(catSourceEntries);
  const catEl = document.getElementById('catTotals');
  catEl.innerHTML = '';
  DESPESA_CATS.forEach(c=>{
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = `<span class="cat-name">${c}</span><span class="cat-amt">${fmtMoney(catTotals[c])}</span>`;
    catEl.appendChild(row);
  });

  if(viewMode === 'ano') renderYearView(y); else renderMonthView(y,m);
}

function renderMonthView(y,m){
  document.getElementById('paperMonth').textContent = MESES[m] + ' ' + y;
  document.getElementById('paperHeaderStats').hidden = false;

  const { receitas, despesas, saldo, entries } = getMonthTotals(y,m);
  document.getElementById('statReceitas').textContent = fmtMoney(receitas);
  document.getElementById('statDespesas').textContent = fmtMoney(despesas);

  const saldoMesEl = document.getElementById('saldoMes');
  saldoMesEl.textContent = fmtMoney(saldo);
  saldoMesEl.className = 'val ' + (saldo >= 0 ? 'pos' : 'neg');

  const ledgerEl = document.getElementById('ledgerRows');
  ledgerEl.innerHTML = '';
  ledgerEl.hidden = false;
  document.getElementById('yearRows').hidden = true;
  document.getElementById('yearTotal').hidden = true;
  document.getElementById('emptyState').hidden = entries.length > 0;

  entries.forEach(t=>{
    const row = document.createElement('div');
    row.className = 'ledger-row';
    const isRec = t.type === 'recebimento';
    row.innerHTML = `
      <div class="row-date">${fmtDateShort(t.date)}</div>
      <div class="row-desc">
        <span class="desc-main">${escapeHtml(t.description)}</span>
        <span class="desc-cat">${isRec ? 'Recebimento' : t.category}</span>
      </div>
      <div class="row-value ${isRec?'pos':'neg'}">${isRec?'+':'-'} ${fmtMoney(t.value)}</div>
      <button class="row-del" data-id="${t.id}" aria-label="Excluir">×</button>
    `;
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.row-del')) return;
      openEdit(t.id);
    });
    ledgerEl.appendChild(row);
  });

  ledgerEl.querySelectorAll('.row-del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteTransaction(btn.dataset.id);
    });
  });
}

function renderYearView(y){
  document.getElementById('paperMonth').textContent = 'Resumo de ' + y;
  document.getElementById('paperHeaderStats').hidden = true;

  const { receitas, despesas, saldo, monthly } = getYearTotals(y);
  const saldoMesEl = document.getElementById('saldoMes');
  saldoMesEl.textContent = fmtMoney(saldo);
  saldoMesEl.className = 'val ' + (saldo >= 0 ? 'pos' : 'neg');

  document.getElementById('ledgerRows').hidden = true;
  document.getElementById('emptyState').hidden = true;

  const maxAbs = Math.max(1, ...monthly.map(mt => Math.abs(mt.saldo)));
  const yearEl = document.getElementById('yearRows');
  yearEl.innerHTML = '';
  yearEl.hidden = false;

  monthly.forEach((mt, idx)=>{
    const pct = Math.round((Math.abs(mt.saldo) / maxAbs) * 100);
    const isPos = mt.saldo >= 0;
    const row = document.createElement('div');
    row.className = 'year-row';
    row.innerHTML = `
      <div class="year-row-month">${MESES_ABREV[idx]}</div>
      <div class="bar-track"><div class="bar-fill ${isPos?'pos':'neg'}" style="width:${pct}%"></div></div>
      <div class="year-row-saldo ${isPos?'pos':'neg'}">${fmtMoney(mt.saldo)}</div>
    `;
    row.addEventListener('click', ()=>{
      state.viewMode = 'mes';
      state.viewMonth = idx;
      state.viewYear = y;
      render();
    });
    yearEl.appendChild(row);
  });

  const totalEl = document.getElementById('yearTotal');
  totalEl.hidden = false;
  document.getElementById('yearTotalVal').textContent = fmtMoney(saldo);
  document.getElementById('yearTotalVal').className = 'val ' + (saldo >= 0 ? 'pos' : 'neg');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---- Modal handling ----
const modalBackdrop = document.getElementById('modalBackdrop');
const txForm = document.getElementById('txForm');
const btnRecebimento = document.getElementById('btnRecebimento');
const btnConta = document.getElementById('btnConta');
const fieldCategoria = document.getElementById('fieldCategoria');
let currentType = 'conta';

function setType(type){
  currentType = type;
  btnRecebimento.classList.toggle('active', type==='recebimento');
  btnConta.classList.toggle('active', type==='conta');
  fieldCategoria.style.display = type==='conta' ? 'flex' : 'none';
}

btnRecebimento.addEventListener('click', ()=> setType('recebimento'));
btnConta.addEventListener('click', ()=> setType('conta'));

function openAdd(){
  state.editingId = null;
  document.getElementById('modalTitle').textContent = 'Novo lançamento';
  document.getElementById('btnDelete').hidden = true;
  txForm.reset();
  document.getElementById('inputData').value = new Date().toISOString().slice(0,10);
  setType('conta');
  modalBackdrop.hidden = false;
}

function openEdit(id){
  const t = state.transactions.find(x=>x.id===id);
  if(!t) return;
  state.editingId = id;
  document.getElementById('modalTitle').textContent = 'Editar lançamento';
  document.getElementById('btnDelete').hidden = false;
  document.getElementById('inputDescricao').value = t.description;
  document.getElementById('inputData').value = t.date;
  document.getElementById('inputValor').value = t.value;
  setType(t.type);
  if(t.type==='conta') document.getElementById('inputCategoria').value = t.category;
  modalBackdrop.hidden = false;
}

function closeModal(){
  modalBackdrop.hidden = true;
  state.editingId = null;
}

document.getElementById('openAdd').addEventListener('click', openAdd);
document.getElementById('emptyAdd').addEventListener('click', openAdd);
document.getElementById('btnCancel').addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', (e)=>{ if(e.target===modalBackdrop) closeModal(); });

txForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  const description = document.getElementById('inputDescricao').value.trim();
  const date = document.getElementById('inputData').value;
  const value = parseFloat(document.getElementById('inputValor').value);
  const category = currentType === 'conta' ? document.getElementById('inputCategoria').value : null;

  if(!description || !date || isNaN(value) || value <= 0) return;

  if(state.editingId){
    const t = state.transactions.find(x=>x.id===state.editingId);
    Object.assign(t, { description, date, value, type: currentType, category });
  } else {
    state.transactions.push({
      id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      description, date, value, type: currentType, category
    });
  }
  saveData();
  closeModal();
  render();
});

document.getElementById('btnDelete').addEventListener('click', ()=>{
  if(state.editingId) deleteTransaction(state.editingId);
  closeModal();
});

function deleteTransaction(id){
  state.transactions = state.transactions.filter(t=>t.id!==id);
  saveData();
  render();
}

// ---- Month / year navigation ----
document.getElementById('prevMonth').addEventListener('click', ()=>{
  if(state.viewMode === 'ano'){ state.viewYear--; }
  else{
    state.viewMonth--;
    if(state.viewMonth < 0){ state.viewMonth = 11; state.viewYear--; }
  }
  render();
});
document.getElementById('nextMonth').addEventListener('click', ()=>{
  if(state.viewMode === 'ano'){ state.viewYear++; }
  else{
    state.viewMonth++;
    if(state.viewMonth > 11){ state.viewMonth = 0; state.viewYear++; }
  }
  render();
});

document.getElementById('toggleView').addEventListener('click', ()=>{
  state.viewMode = state.viewMode === 'ano' ? 'mes' : 'ano';
  render();
});

loadData();
</script>
</body>
</html>
